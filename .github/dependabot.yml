version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
    ignore:
      # Avalonia.Headless.XUnit 12.1 fails test discovery on xUnit 4 (see ROADMAP).
      - dependency-name: xunit.v3
        versions: [">= 4.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
