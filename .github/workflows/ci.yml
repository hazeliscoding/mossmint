name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Private-file guard
        shell: pwsh
        run: |
          ./build/check-private-files.ps1 -Paths (git ls-files)
          # Positive control: the guard must reject a tracked spreadsheet.
          ./build/check-private-files.ps1 -Paths @("docs/leak.xlsx") -ExpectFailure
          ./build/check-private-files.ps1 -Paths @("samples/bank-export.csv") -ExpectFailure

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Encryption self-check
        shell: pwsh
        run: |
          # ADR-0001: the built app must prove profiles are encrypted, fail closed and ship one SQLite binary.
          $exe = "src/Mossmint.Desktop/bin/Release/net10.0/Mossmint.Desktop.exe"
          $process = Start-Process $exe -ArgumentList "--verify-encryption", "self-check.json" -Wait -PassThru -NoNewWindow
          Get-Content self-check.json
          if ($process.ExitCode -ne 0) { exit 1 }

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { exit 1 }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
